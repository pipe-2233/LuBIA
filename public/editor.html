<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Editor Excel — LUBIA</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:system-ui,-apple-system,sans-serif;background:#F8FAFC;color:#111827;display:flex;flex-direction:column;height:100vh}
    .header{background:#111827;border-bottom:4px solid #EAB308;padding:10px 20px;display:flex;justify-content:space-between;align-items:center}
    .header h1{font-size:16px;color:#EAB308}
    .header .filename{color:#9CA3AF;font-size:13px}
    .header .save-status{font-size:12px;color:#6B7280;display:flex;align-items:center;gap:4px}
    .toolbar{display:flex;gap:6px;padding:10px 20px;align-items:center;flex-wrap:wrap;border-bottom:1px solid #E5E7EB;background:#fff}
    .toolbar button{padding:5px 14px;border:1px solid #D1D5DB;background:#fff;border-radius:6px;cursor:pointer;font-size:13px;font-weight:600;transition:all .15s}
    .toolbar button:hover{background:#F3F4F6;border-color:#9CA3AF}
    .toolbar .sep{width:1px;height:20px;background:#E5E7EB;margin:0 4px}
    .table-wrap{flex:1;overflow:auto;background:#fff;margin:8px 20px;border:1px solid #D1D5DB;border-radius:0}
    .editable-table{border-collapse:collapse;font-size:13px;table-layout:fixed}
    .editable-table th{background:#F3F4F6;color:#374151;padding:6px 10px;text-align:left;font-weight:600;white-space:nowrap;position:sticky;top:0;z-index:2;border:1px solid #D1D5DB;min-width:100px;font-size:12px}
    .editable-table td{padding:0;border:1px solid #D1D5DB}
    .editable-table td input{width:100%;height:100%;padding:5px 8px;border:none;font-size:13px;background:#fff;outline:none;font-family:system-ui;min-height:28px}
    .editable-table td input:focus{background:#E8F0FE;box-shadow:inset 0 0 0 2px #4285F4}
    .editable-table td input.merge-hl{background:#D2E3FC!important;box-shadow:inset 0 0 0 1px #4285F4!important}
    .editable-table tr:nth-child(even) td input{background:#FAFAFA}
    .editable-table tr:nth-child(even) td input:focus{background:#E8F0FE}
    .cell-focused{box-shadow:inset 0 0 0 2px #EAB308!important;background:#FEF9C3!important}

    .img-picker{position:fixed;z-index:100;background:#fff;border:1px solid #D1D5DB;border-radius:10px;box-shadow:0 4px 20px rgba(0,0,0,.2);max-height:240px;overflow-y:auto;min-width:240px;display:none}
    .img-picker .item{padding:8px 14px;font-size:12px;cursor:pointer;display:flex;align-items:center;gap:8px;transition:background .1s}
    .img-picker .item:hover,.img-picker .item.sel{background:#FEF3C7}
    .img-preview-box{position:fixed;z-index:101;background:#fff;border:1px solid #D1D5DB;border-radius:10px;box-shadow:0 4px 20px rgba(0,0,0,.2);padding:10px;width:260px;display:none}
    .img-preview-box img{width:100%;border-radius:6px;max-height:200px;object-fit:contain}
    .footer-bar{background:#F9FAFB;border-top:1px solid #E5E7EB;padding:8px 20px;font-size:11px;color:#6B7280;display:flex;justify-content:space-between}
  </style>
</head>
<body>

<div class="header">
  <div><h1>LUBIA Editor</h1><span class="filename" id="filename">Cargando...</span></div>
  <div class="save-status"><button class="btn btn-primary btn-sm" onclick="manualSave()" title="Guardar ahora" style="margin-right:8px;padding:4px 12px;font-size:12px">💾 Guardar</button><span id="save-status">📝 Sin cambios</span></div>
</div>

<div class="toolbar">
  <button onclick="undo()" title="Deshacer última acción">↩️ Deshacer</button>
  <span class="sep"></span>
  <button onclick="formatCell('bold')"><b>B</b></button>
  <button onclick="formatCell('italic')"><i>I</i></button>
  <span class="sep"></span>
  <span style="font-size:12px;color:#374151">🎨</span><input type="color" id="bg-color" value="#ffffff" onchange="applyCellColor('bg',this.value)" title="Color de fondo" style="width:28px;height:24px;border:none;cursor:pointer;padding:0">
  <span style="font-size:12px;color:#374151">🖊</span><input type="color" id="text-color" value="#000000" onchange="applyCellColor('color',this.value)" title="Color de texto" style="width:28px;height:24px;border:none;cursor:pointer;padding:0">
  <span class="sep"></span>
  <select id="border-style" onchange="applyBorder(this.value)" style="padding:4px 8px;border:1px solid #D1D5DB;border-radius:6px;font-size:12px">
    <option value="">Bordes</option><option value="thin">Fino</option><option value="thick">Grueso</option><option value="double">Doble</option><option value="none">Sin borde</option>
  </select>
  <button onclick="mergeSelected()" title="Combinar celdas">⬜</button>
  <button onclick="unmergeCell()" title="Separar celdas">▦</button>
  <span id="merge-status" style="font-size:11px;color:#EAB308;font-weight:600;display:none">Seleccioná celda final para combinar (Esc cancelar)</span>
  <span class="sep"></span>
  <button onclick="addRow()">+ Fila</button>
  <button onclick="deleteRow()">− Fila</button>
  <span class="sep"></span>
  <span style="font-size:12px;color:#6B7280">💡 <code>/img</code> para imagen</span>
</div>

<div class="table-wrap"><table class="editable-table" id="table"><thead id="thead"></thead><tbody id="tbody"></tbody></table></div>

<div class="img-picker" id="img-picker"></div>
<div class="img-preview-box" id="img-preview"></div>

<div class="footer-bar">
  <span>LUBIA · INGELUBSA S.A.S.</span>
  <span><a id="download-link" href="#" target="_blank" style="color:#EAB308;text-decoration:none">⬇ Descargar Excel</a> | <span id="cell-info">Fila: — Col: —</span></span>
</div>

<script>
const params=new URLSearchParams(location.search);
const fileId=params.get("id"),projectId=params.get("project");
let headers=[],rows=[],activeCell=null,saveTimeout=null,dirty=false,imgFiles=[],imgIdx=0,cellStyles={},mergeStart=null,selectionRange=null,shiftHeld=false,history=[];

function esc(s){const d=document.createElement("div");d.textContent=s;return d.innerHTML}

async function init(){
  if(!fileId||!projectId){document.body.innerHTML="<p style='padding:40px;text-align:center;color:#EF4444'>Faltan parámetros: id y project</p>";return}
  try{
    const r=await fetch(`/api/projects/${projectId}/files/${fileId}/preview`);
    const d=await r.json();
    if(d.error){document.getElementById("filename").textContent=d.error;return}
    document.getElementById("filename").textContent=d.filename||"Sin nombre";
    document.title="Editor - "+esc(d.filename||"Excel");
    document.getElementById("download-link").href=`/api/projects/${projectId}/files/${fileId}/view`;
    headers=d.headers||[];rows=d.rows||[];cellStyles=d.cellStyles||{};
    if(headers.length===0){headers=["A","B","C"];rows=[]}
    render();
  }catch(e){document.getElementById("filename").textContent="Error: "+e.message}
}

// Mapea qué celdas son "origen" de un merge (llevan colspan/rowspan) y cuáles quedan
// tapadas por un merge (no se dibujan, como hace Excel de verdad con <td> combinados).
function buildMergeMap(){
  const map={};
  for(const m of (cellStyles["_merges"]||[])){
    const r1=Number(m.r1),c1=Number(m.c1),r2=Number(m.r2),c2=Number(m.c2);
    if(!(r2>=r1&&c2>=c1))continue;
    map[r1+"_"+c1]={rowspan:r2-r1+1,colspan:c2-c1+1};
    for(let ri=r1;ri<=r2;ri++)for(let ci=c1;ci<=c2;ci++){
      if(ri===r1&&ci===c1)continue;
      map[ri+"_"+ci]="covered";
    }
  }
  return map;
}
function render(){
  const mergeMap=buildMergeMap();
  document.getElementById("thead").innerHTML="<tr>"+headers.map(h=>"<th>"+esc(h)+"</th>").join("")+"</tr>";
  document.getElementById("tbody").innerHTML=rows.map((r,ri)=>{
    let tds="";
    headers.forEach((_,j)=>{
      const mk=mergeMap[ri+"_"+j];
      if(mk==="covered")return; // la celda de arriba/izquierda ya cubre esta posición con colspan/rowspan
      const s=cellStyles[ri+"_"+j]||{};
      const bg=s.bg||"";const fc=s.color||"";const bw=s.bold?"bold":"normal";const fs=s.italic?"italic":"normal";
      let hl="";
      if(selectionRange&&ri>=selectionRange.r1&&ri<=selectionRange.r2&&j>=selectionRange.c1&&j<=selectionRange.c2)hl=" merge-hl";
      if(mergeStart&&activeCell){const r1=Math.min(activeCell.row,mergeStart.row),r2=Math.max(activeCell.row,mergeStart.row),c1=Math.min(activeCell.col,mergeStart.col),c2=Math.max(activeCell.col,mergeStart.col);if(ri>=r1&&ri<=r2&&j>=c1&&j<=c2)hl=" merge-hl"}
      const span=mk?` rowspan="${mk.rowspan}" colspan="${mk.colspan}"`:"";
      tds+=`<td${span}><input value="${esc((r["col"+j]||"").replace(/\[img:.*?\]/,"").trim())}" onclick="focusCell(${ri},${j},event)" onfocus="quickFocus(${ri},${j})" oninput="cellChange(this,${ri},${j})" onkeydown="cellKey(event,${ri},${j})" data-row="${ri}" data-col="${j}" style="background:${bg};color:${fc};font-weight:${bw};font-style:${fs};${s.border?'border:2px solid #374151;':''}" class="${hl}"></td>`;
    });
    return `<tr>${tds}</tr>`;
  }).join("");
}
function focusCell(ri,j,e){
  if(e&&e.shiftKey&&activeCell){
    const r1=Math.min(activeCell.row,ri),r2=Math.max(activeCell.row,ri),c1=Math.min(activeCell.col,j),c2=Math.max(activeCell.col,j);
    selectionRange={r1,r2,c1,c2};
    document.getElementById("cell-info").textContent=`Fila: ${ri+1} Col: ${String.fromCharCode(65+j)}`;
    render();return
  }
  activeCell={row:ri,col:j};
  selectionRange=null;
  document.getElementById("cell-info").textContent=`Fila: ${ri+1} Col: ${String.fromCharCode(65+j)}`
}
function quickFocus(ri,j){if(!shiftHeld){activeCell={row:ri,col:j};selectionRange=null}document.getElementById("cell-info").textContent=`Fila: ${ri+1} Col: ${String.fromCharCode(65+j)}`;if(mergeStart)render()}
function cellChange(inp,ri,j){beginEdit();rows[ri]["col"+j]=inp.value;markDirty();if(inp.value.includes("/img"))showImgPicker(inp)}

function cellKey(e,ri,j){
  // Se busca por data-row/data-col (no por posición nth-child) porque las filas con
  // celdas combinadas tienen menos <td> que las demás y la posición no coincide.
  if(e.key==="Enter"){e.preventDefault();const n=document.querySelector(`#tbody input[data-row="${ri+1}"][data-col="${j}"]`);if(n)n.focus();else{addRow();setTimeout(()=>{const l=document.querySelector(`#tbody input[data-row="${rows.length-1}"][data-col="0"]`);if(l)l.focus()},50)}}
}

async function autoSave(){
  try{await fetch(`/api/projects/${projectId}/files/${fileId}/edit`,{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify({headers,rows,cellStyles})});dirty=false;document.getElementById("save-status").textContent="💾 Guardado";setTimeout(()=>{if(!dirty)document.getElementById("save-status").textContent="📝 Sin cambios"},2000)}catch(e){document.getElementById("save-status").textContent="❌ Error al guardar"}
}

// Deshacer: guarda una foto del estado justo antes del primer cambio de cada tanda (hasta el próximo guardado)
function pushHistorySnapshot(){history.push(JSON.parse(JSON.stringify({headers,rows,cellStyles})));if(history.length>50)history.shift()}
function beginEdit(){if(!dirty)pushHistorySnapshot()}
function markDirty(status){dirty=true;document.getElementById("save-status").textContent=status||"📝 Editando...";clearTimeout(saveTimeout);saveTimeout=setTimeout(autoSave,3000)}
function undo(){
  if(history.length===0){document.getElementById("save-status").textContent="↩️ Nada para deshacer";setTimeout(()=>{if(!dirty)document.getElementById("save-status").textContent="📝 Sin cambios"},1500);return}
  const prev=history.pop();
  headers=prev.headers;rows=prev.rows;cellStyles=prev.cellStyles;
  activeCell=null;selectionRange=null;mergeStart=null;
  document.getElementById("merge-status").style.display="none";
  dirty=true;
  document.getElementById("save-status").textContent="↩️ Deshecho";
  clearTimeout(saveTimeout);saveTimeout=setTimeout(autoSave,3000);
  render();
}

function addRow(){beginEdit();const r={};headers.forEach((_,j)=>r["col"+j]="");rows.push(r);markDirty();render()}
function deleteRow(){if(!activeCell)return;beginEdit();rows.splice(activeCell.row,1);markDirty("📝 Fila eliminada");render()}
function getRangeCells(){if(!activeCell)return[];const cells=[];if(selectionRange){for(let ri=selectionRange.r1;ri<=selectionRange.r2;ri++)for(let ci=selectionRange.c1;ci<=selectionRange.c2;ci++)cells.push({row:ri,col:ci})}else{cells.push({row:activeCell.row,col:activeCell.col})}return cells}
function formatCell(style){const cells=getRangeCells();if(!cells.length)return;beginEdit();cells.forEach(({row:ri,col:ci})=>{const k=ri+"_"+ci;cellStyles[k]=cellStyles[k]||{};cellStyles[k][style]=!cellStyles[k][style]});markDirty();render()}
function applyCellColor(type,val){const cells=getRangeCells();if(!cells.length)return;beginEdit();cells.forEach(({row:ri,col:ci})=>{const k=ri+"_"+ci;cellStyles[k]=cellStyles[k]||{};cellStyles[k][type]=val});markDirty();render()}function applyBorder(style){const cells=getRangeCells();if(!cells.length)return;beginEdit();cells.forEach(({row:ri,col:ci})=>{const k=ri+"_"+ci;cellStyles[k]=cellStyles[k]||{};cellStyles[k].border=style==="none"?null:style});document.getElementById("border-style").value="";markDirty();render()}async function manualSave(){if(!dirty)return;await autoSave();document.getElementById("save-status").textContent="💾 Guardado"}
function applyMerge(r1,c1,r2,c2){
  beginEdit();
  cellStyles["_merges"]=cellStyles["_merges"]||[];
  cellStyles["_merges"].push({r1,c1,r2,c2});
  activeCell={row:r1,col:c1};
  markDirty();
}
function mergeSelected(){
  // Si hay una selección múltiple (shift+click), se combina directo esa selección
  if(selectionRange){
    const {r1,c1,r2,c2}=selectionRange;
    selectionRange=null;
    if(r1===r2&&c1===c2){render();return}
    applyMerge(r1,c1,r2,c2);
    render();
    return;
  }
  // Sin selección múltiple: modo clásico de dos clics (celda inicial + celda final)
  if(!activeCell)return;
  if(!mergeStart){mergeStart={...activeCell};document.getElementById("merge-status").style.display="inline";render();return}
  const r1=Math.min(activeCell.row,mergeStart.row),r2=Math.max(activeCell.row,mergeStart.row),c1=Math.min(activeCell.col,mergeStart.col),c2=Math.max(activeCell.col,mergeStart.col);
  mergeStart=null;
  document.getElementById("merge-status").style.display="none";
  if(r1===r2&&c1===c2){render();return}
  applyMerge(r1,c1,r2,c2);
  render();
}
function unmergeCell(){if(!activeCell)return;beginEdit();cellStyles["_merges"]=(cellStyles["_merges"]||[]).filter(m=>!(m.r1<=activeCell.row&&m.r2>=activeCell.row&&m.c1<=activeCell.col&&m.c2>=activeCell.col));mergeStart=null;document.getElementById("merge-status").style.display="none";markDirty();render()}

// /img picker
async function showImgPicker(inp){
  if(imgFiles.length===0){const r=await fetch(`/api/projects/${projectId}/files?type=image`);const d=await r.json();imgFiles=d.files||[]}
  if(imgFiles.length===0)return;
  const el=document.getElementById("img-picker"),rect=inp.getBoundingClientRect();
  el.style.left=rect.left+"px";el.style.top=(rect.bottom+4)+"px";el.style.minWidth=Math.max(240,rect.width)+"px";
  el.innerHTML=imgFiles.map((f,i)=>`<div class="item" data-idx="${i}" onmouseenter="previewImg('${f.id}')" onclick="insertImg('${f.id}','${esc(f.name)}')">🖼️ ${esc(f.name)}<span style="color:#9CA3AF;font-size:10px;margin-left:auto">${(f.size/1024).toFixed(1)}KB</span></div>`).join("");
  el.style.display="block";imgIdx=0
}

function previewImg(id){const pv=document.getElementById("img-preview"),el=document.getElementById("img-picker"),prect=el.getBoundingClientRect();pv.style.left=(prect.right+8)+"px";pv.style.top=prect.top+"px";pv.style.display="block";pv.innerHTML=`<img src="/api/projects/${projectId}/files/${id}/view" onerror="this.parentElement.style.display='none'" alt="Preview"><div style="font-size:11px;text-align:center;margin-top:4px;color:#6B7280">Preview</div>`}

function hideImgPreview(){document.getElementById("img-preview").style.display="none";document.getElementById("img-preview").innerHTML=""}
function insertImg(id,name){document.getElementById("img-picker").style.display="none";hideImgPreview();const inp=document.querySelector(`#tbody input[data-row="${activeCell.row}"][data-col="${activeCell.col}"]`);if(inp){beginEdit();inp.value=inp.value.replace(/\/img.*$/,"")+`[img: ${name}]`;rows[activeCell.row]["col"+activeCell.col]=inp.value;markDirty();inp.focus()}}

document.addEventListener("click",e=>{if(!e.target.closest("#img-picker")&&!e.target.closest("td input")){document.getElementById("img-picker").style.display="none";hideImgPreview()}})
document.addEventListener("keydown",e=>{if(e.key==="Shift")shiftHeld=true;if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="z"&&!e.target.closest("td input")){e.preventDefault();undo();return}if(e.key==="Escape"){mergeStart=null;document.getElementById("merge-status").style.display="none";document.getElementById("img-picker").style.display="none";hideImgPreview();render()}})
document.addEventListener("keyup",e=>{if(e.key==="Shift")shiftHeld=false})

// Auto-save al cerrar
window.addEventListener("beforeunload",e=>{if(dirty){autoSave();e.preventDefault();e.returnValue=""}})

init();
</script>
</body>
</html>
